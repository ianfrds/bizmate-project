<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizmate - Daftar Pesanan</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <!-- Shared LocalStorage Database -->
  <script src="js/database.js"></script>
  <script src="js/sidebar.js" defer></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              blueRoyal: '#0c4cb4',
              orange: '#fa7315',
              blueLight: '#eef2ff',
              sidebar: '#0B1120',
            }
          },
          boxShadow: {
            'soft': '0 2px 10px rgba(0, 0, 0, 0.02)',
            'card': '0 4px 20px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="min-h-screen flex overflow-x-hidden selection:bg-brand-blueRoyal selection:text-white">

  <!-- ==================== SIDEBAR ==================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-brand-sidebar text-slate-400 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 shadow-2xl lg:shadow-none border-r border-white/5"></aside>

  <!-- ==================== MAIN LAYOUT ==================== -->
  <div class="flex-grow lg:pl-64 flex flex-col min-h-screen">

    <!-- Topbar -->
    <header class="h-20 bg-white/80 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-40 flex items-center justify-between px-4 sm:px-8">
      <div class="flex items-center gap-4 flex-grow">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition">
          <i class="ti ti-menu-2 text-xl"></i>
        </button>
        <div class="flex items-center gap-2 font-outfit hidden sm:flex">
          <span class="px-2.5 py-1 bg-brand-blueRoyal/10 text-brand-blueRoyal text-[10px] font-black tracking-widest uppercase rounded-lg">Admin</span>
          <span class="font-black text-slate-800 tracking-tight">Bizmate Console</span>
        </div>
      </div>

      <div class="flex items-center gap-4 shrink-0">
        <button class="p-2.5 text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-full transition relative">
          <i class="ti ti-bell text-xl"></i>
          <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 border-2 border-slate-50 rounded-full"></span>
        </button>
        <div class="h-6 w-px bg-slate-200 mx-2 hidden sm:block"></div>
        <a href="../index.html" class="hidden sm:flex items-center gap-2 px-4 py-2 bg-slate-50 border border-slate-200 hover:bg-slate-100 text-slate-600 rounded-full text-xs font-bold transition">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Live Storefront
          <i class="ti ti-external-link text-sm"></i>
        </a>
      </div>
    </header>

    <main class="flex-grow p-4 sm:p-8 w-full max-w-[1600px] mx-auto space-y-6">
      
      <!-- Metrics Overview -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-soft">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-outfit mb-1">Pesanan Baru</p>
          <p id="orders-new" class="text-2xl font-black text-slate-800">24</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-soft">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-outfit mb-1">Siap Dikirim</p>
          <p id="orders-ready" class="text-2xl font-black text-amber-600">12</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-soft">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-outfit mb-1">Dalam Pengiriman</p>
          <p id="orders-shipping" class="text-2xl font-black text-brand-blueRoyal">45</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-soft">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-outfit mb-1">Selesai (Bulan Ini)</p>
          <p id="orders-completed" class="text-2xl font-black text-emerald-600">892</p>
        </div>
      </div>

      <!-- Section Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="font-outfit font-black text-2xl sm:text-3xl text-slate-800 tracking-tight">Manajemen Pesanan</h1>
          <p class="text-xs text-slate-500 font-medium">Kelola pesanan pelanggan, status pengiriman, dan lacak transaksi</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold rounded-xl text-xs transition duration-200">
            <i class="ti ti-download"></i> Export Data
          </button>
          <button class="flex items-center gap-2 px-5 py-2.5 bg-brand-blueRoyal hover:bg-brand-blueRoyal/95 text-white font-bold rounded-xl text-xs transition duration-200 shadow-md shadow-brand-blueRoyal/20 font-outfit uppercase tracking-wider">
            Pesanan <span class="font-normal text-lg">+</span>
          </button>
        </div>
      </div>

      <!-- Filters Bar & Tabs -->
      <div class="space-y-4">
        <!-- Search & Date Range -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="relative w-full">
            <input id="date-input" type="text" placeholder="Pilih Tanggal" onfocus="(this.type='date')" onblur="(this.type='text')" class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 bg-white shadow-soft focus:ring-2 focus:ring-brand-blueRoyal/20 focus:border-brand-blueRoyal focus:outline-none transition">
            <i class="ti ti-calendar absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          </div>
          <div class="relative sm:col-span-2">
            <input id="search-input" type="text" placeholder="Cari nomor pesanan atau nama customer..." class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 bg-white shadow-soft focus:ring-2 focus:ring-brand-blueRoyal/20 focus:border-brand-blueRoyal focus:outline-none transition">
            <i class="ti ti-search absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          </div>
        </div>

        <!-- Tabs & Pagination Container -->
        <div class="flex items-center justify-between gap-4">
          <!-- Horizontal scrollable tabs -->
          <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar flex-grow">
            <button onclick="setFilterTab('Semua')" id="tab-Semua" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Semua</button>
            <button onclick="setFilterTab('Belum Bayar')" id="tab-Belum-Bayar" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Belum Bayar</button>
            <button onclick="setFilterTab('Menunggu')" id="tab-Menunggu" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Menunggu</button>
            <button onclick="setFilterTab('Diproses')" id="tab-Diproses" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Diproses</button>
            <button onclick="setFilterTab('Dikemas')" id="tab-Dikemas" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Dikemas</button>
            <button onclick="setFilterTab('Dikirim')" id="tab-Dikirim" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Dikirim</button>
            <button onclick="setFilterTab('Selesai')" id="tab-Selesai" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Selesai</button>
            <button onclick="setFilterTab('Batal')" id="tab-Batal" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Batal</button>
            <button onclick="setFilterTab('Perlu Tindakan')" id="tab-Perlu-Tindakan" class="tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200">Perlu Tindakan</button>
          </div>
          <!-- Pagination Arrows -->
          <div class="flex items-center gap-1 shrink-0">
            <button class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:border-slate-300 bg-white transition shadow-soft">
              <i class="ti ti-chevron-left text-sm"></i>
            </button>
            <button class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:border-slate-300 bg-white transition shadow-soft">
              <i class="ti ti-chevron-right text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Order Cards List -->
      <div id="orders-cards-list" class="space-y-6">
        <!-- Dynamically rendered order cards -->
      </div>

    </main>
  </div>

  <!-- Toast notification container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

  <script>

    // Modern dynamic orders renderer
    let currentTab = 'Semua';

    // Toast Notification System
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const icon = type === 'success' ? 'ti-circle-check-filled text-emerald-500' : 'ti-circle-x-filled text-rose-500';
      
      toast.className = 'flex items-center gap-3 bg-white/90 backdrop-blur-md border border-slate-200 shadow-xl px-4 py-3 rounded-2xl animate-bounce-in min-w-[280px] max-w-sm transition-all duration-300 translate-y-4 opacity-0';
      toast.innerHTML = `
        <i class="ti ${icon} text-xl shrink-0"></i>
        <div class="flex-grow">
          <p class="text-xs font-bold text-slate-800">${message}</p>
        </div>
        <button class="text-slate-400 hover:text-slate-600 transition" onclick="this.parentElement.remove()">
          <i class="ti ti-x text-sm"></i>
        </button>
      `;
      
      container.appendChild(toast);
      
      // Animate in
      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      }, 50);
      
      // Auto-destruct
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Helper: Copy text to clipboard
    window.copyText = function(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Berhasil menyalin ${label}: ${text}`, 'success');
      }).catch(err => {
        // Fallback for non-secure contexts
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(`Berhasil menyalin ${label}: ${text}`, 'success');
        } catch (e) {
          showToast('Gagal menyalin teks.', 'error');
        }
        document.body.removeChild(textarea);
      });
    };

    // Helper: Match Indonesian Month strings
    function matchDate(orderDateStr, filterDateVal) {
      if (!filterDateVal) return true;
      // filterDateVal is YYYY-MM-DD
      const parts = orderDateStr.split(/\s+/);
      if (parts.length < 3) return false;
      
      const day = parts[0].padStart(2, '0');
      const monthName = parts[1];
      const year = parts[2].replace(',', '');
      
      const monthsMap = {
        'Januari': '01', 'Februari': '02', 'Maret': '03', 'April': '04', 'Mei': '05', 'Juni': '06',
        'Juli': '07', 'Agustus': '08', 'September': '09', 'Oktober': '10', 'November': '11', 'Desember': '12',
        'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'Mei': '05', 'Jun': '06',
        'Jul': '07', 'Ags': '08', 'Sep': '09', 'Okt': '10', 'Nov': '11', 'Des': '12'
      };
      
      const monthVal = monthsMap[monthName] || '00';
      const formattedOrderDate = `${year}-${monthVal}-${day}`;
      return formattedOrderDate === filterDateVal;
    }

    // Global filters update trigger
    window.setFilterTab = function(tab) {
      currentTab = tab;
      
      // Update Tab Visual Classes
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border transition-all duration-200 border-slate-200 text-slate-500 bg-white hover:bg-slate-50";
      });
      
      const activeBtnId = 'tab-' + tab.replace(/\s+/g, '-');
      const activeBtn = document.getElementById(activeBtnId);
      if (activeBtn) {
        activeBtn.className = "tab-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold border border-blue-600 text-blue-600 bg-blue-50/50 transition-all duration-200";
      }
      
      renderOrders();
    };

    // Database interaction helpers mapped to card actions
    window.updateCourier = function(id, courier) {
      BizmateDB.updateOrderCourier(id, courier);
      showToast(`Kurir pesanan ${id} berhasil diatur ke ${courier}`, 'success');
      renderOrders();
    };

    window.processPayment = function(id) {
      if (confirm(`Apakah Anda ingin memverifikasi pembayaran untuk pesanan ${id}?`)) {
        BizmateDB.updateOrderPayment(id, 'Paid');
        showToast(`Pembayaran pesanan ${id} berhasil diverifikasi!`, 'success');
        renderOrders();
      }
    };

    window.processShipping = function(id) {
      const randomResi = '928' + Math.floor(100000000000000 + Math.random() * 900000000000000);
      if (confirm(`Apakah Anda ingin memproses dan kirim pesanan ${id}?`)) {
        const orders = BizmateDB.getOrders();
        const oIdx = orders.findIndex(ord => ord.id === id);
        if (oIdx !== -1) {
          orders[oIdx].shippingStatus = 'Shipped';
          orders[oIdx].trackingNumber = randomResi;
          if (orders[oIdx].courier === 'Atur kurir...') {
            orders[oIdx].courier = 'JNE Regular';
          }
          localStorage.setItem('bizmate_orders', JSON.stringify(orders));
        }
        showToast(`Pesanan ${id} berhasil dikemas & diserahkan ke kurir! No Resi: ${randomResi}`, 'success');
        renderOrders();
      }
    };

    window.completeOrder = function(id) {
      if (confirm(`Apakah Anda ingin menandai pesanan ${id} sebagai SELESAI?`)) {
        BizmateDB.updateOrderShipping(id, 'Delivered');
        showToast(`Pesanan ${id} dinyatakan SELESAI. Transaksi selesai!`, 'success');
        renderOrders();
      }
    };

    // The core order cards rendering engine
    function renderOrders() {
      const orders = BizmateDB.getOrders();
      const searchInput = document.getElementById('search-input');
      const dateInput = document.getElementById('date-input');
      const cardsList = document.getElementById('orders-cards-list');
      
      // Calculate top statistics badges
      let newCount = 0;
      let readyCount = 0;
      let shippingCount = 0;
      let completedCount = 0;

      orders.forEach(o => {
        if (o.paymentStatus === 'Pending') newCount++;
        if (o.paymentStatus === 'Paid' && o.shippingStatus === 'Unfulfilled') readyCount++;
        if (o.shippingStatus === 'Shipped') shippingCount++;
        if (o.shippingStatus === 'Delivered') completedCount++;
      });

      // Update metrics with seeded enterprise scaling offsets
      document.getElementById('orders-new').textContent = newCount + 12;
      document.getElementById('orders-ready').textContent = readyCount + 8;
      document.getElementById('orders-shipping').textContent = shippingCount + 22;
      document.getElementById('orders-completed').textContent = completedCount + 814;

      // Filter logic
      const query = searchInput.value.toLowerCase().trim();
      const selectedDate = dateInput.value;

      let filtered = orders.filter(o => {
        // Tab Filters
        if (currentTab === 'Belum Bayar' || currentTab === 'Menunggu') {
          if (o.paymentStatus !== 'Pending') return false;
        } else if (currentTab === 'Diproses' || currentTab === 'Dikemas') {
          if (o.paymentStatus !== 'Paid' || o.shippingStatus !== 'Unfulfilled') return false;
        } else if (currentTab === 'Dikirim') {
          if (o.shippingStatus !== 'Shipped') return false;
        } else if (currentTab === 'Selesai') {
          if (o.shippingStatus !== 'Delivered') return false;
        } else if (currentTab === 'Batal') {
          if (o.paymentStatus !== 'Failed') return false;
        } else if (currentTab === 'Perlu Tindakan') {
          const needsAction = o.paymentStatus === 'Pending' || (o.paymentStatus === 'Paid' && o.shippingStatus === 'Unfulfilled');
          if (!needsAction) return false;
        }

        // Date filter
        if (selectedDate && !matchDate(o.date, selectedDate)) return false;

        // Search query
        const displayCustomer = o.customer || '';
        const displayInvoice = o.invoice || '';
        const displayTracking = o.trackingNumber || '';
        const matchSearch = o.id.toLowerCase().includes(query) || 
                            displayCustomer.toLowerCase().includes(query) || 
                            displayInvoice.toLowerCase().includes(query) ||
                            displayTracking.toLowerCase().includes(query);

        return matchSearch;
      });

      // Render cards
      cardsList.innerHTML = '';
      if (filtered.length === 0) {
        cardsList.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl py-16 px-4 text-center text-slate-400 font-medium shadow-soft">
            <i class="ti ti-receipt-off text-5xl block mb-3 text-slate-300"></i>
            Tidak ada pesanan ditemukan pada tab ini.
          </div>
        `;
        return;
      }

      filtered.forEach(o => {
        // Payment Badge Styling
        let payBadgeClass = '';
        let payText = '';
        if (o.paymentStatus === 'Paid') {
          payBadgeClass = 'bg-emerald-50 text-emerald-600 border-emerald-100';
          payText = 'Lunas';
        } else if (o.paymentStatus === 'Pending') {
          payBadgeClass = 'bg-amber-50 text-amber-600 border-amber-100';
          payText = 'Belum Bayar';
        } else {
          payBadgeClass = 'bg-rose-50 text-rose-600 border-rose-100';
          payText = 'Gagal / Batal';
        }

        // Shipping Badge Styling
        let shipBadgeClass = '';
        let shipText = '';
        if (o.shippingStatus === 'Delivered') {
          shipBadgeClass = 'bg-emerald-50 text-emerald-600 border-emerald-100';
          shipText = 'Selesai';
        } else if (o.shippingStatus === 'Shipped') {
          shipBadgeClass = 'bg-blue-50 text-blue-600 border-blue-100';
          shipText = 'Dikirim';
        } else {
          shipBadgeClass = 'bg-slate-100 text-slate-600 border-slate-200';
          shipText = 'Diproses';
        }

        // Action Button Builder
        let actionButtonHtml = '';
        if (o.paymentStatus === 'Pending') {
          actionButtonHtml = `
            <button onclick="processPayment('${o.id}')" class="flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/10 hover:shadow-blue-600/20 active:scale-95 transition-all font-outfit uppercase tracking-wider shrink-0">
              Menunggu Pembayaran
              <div class="w-4 h-4 bg-white/20 rounded-full flex items-center justify-center">
                <i class="ti ti-chevron-right text-[10px]"></i>
              </div>
            </button>
          `;
        } else if (o.paymentStatus === 'Paid' && o.shippingStatus === 'Unfulfilled') {
          actionButtonHtml = `
            <button onclick="processShipping('${o.id}')" class="flex items-center justify-center gap-2 px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-orange-500/10 hover:shadow-orange-500/20 active:scale-95 transition-all font-outfit uppercase tracking-wider shrink-0">
              Kirim Pesanan
              <div class="w-4 h-4 bg-white/20 rounded-full flex items-center justify-center">
                <i class="ti ti-truck text-[10px]"></i>
              </div>
            </button>
          `;
        } else if (o.shippingStatus === 'Shipped') {
          actionButtonHtml = `
            <button onclick="completeOrder('${o.id}')" class="flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/10 hover:shadow-blue-600/20 active:scale-95 transition-all font-outfit uppercase tracking-wider shrink-0">
              Selesai
              <div class="w-4 h-4 bg-white/20 rounded-full flex items-center justify-center">
                <i class="ti ti-chevron-right text-[10px]"></i>
              </div>
            </button>
          `;
        } else if (o.shippingStatus === 'Delivered') {
          actionButtonHtml = `
            <div class="flex items-center gap-2 px-4 py-2 bg-emerald-50 border border-emerald-100 text-emerald-600 font-bold text-xs rounded-xl shrink-0">
              <i class="ti ti-circle-check text-sm"></i>
              Transaksi Selesai
            </div>
          `;
        } else {
          actionButtonHtml = `
            <div class="flex items-center gap-2 px-4 py-2 bg-rose-50 border border-rose-100 text-rose-600 font-bold text-xs rounded-xl shrink-0">
              <i class="ti ti-circle-x text-sm"></i>
              Pesanan Batal
            </div>
          `;
        }

        // Product Items HTML builder
        const itemsHtml = o.items.map(item => `
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl border border-slate-100 bg-slate-50 flex-shrink-0 overflow-hidden">
              <img src="${item.image || 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=150&q=80'}" class="w-full h-full object-cover">
            </div>
            <div>
              <h4 class="font-bold text-slate-800 text-sm leading-snug">${item.name}</h4>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${item.variant ? `<span class="bg-slate-100 text-slate-600 rounded px-1.5 py-0.5 text-[10px] font-bold uppercase">${item.variant}</span>` : ''}
                <span class="text-slate-500 text-xs font-semibold">${item.qty}x Rp ${item.price.toLocaleString('id-ID')}</span>
              </div>
            </div>
          </div>
        `).join('<div class="h-2"></div>');

        // Address Section with safe placeholders
        const addressText = o.address || 'Alamat tidak diisi';
        const displayCustomer = o.customer || 'Customer';
        const displayPhone = o.phone || '';

        // Formulated Card Structure matching the screenshot
        cardsList.innerHTML += `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-soft hover:shadow-card hover:-translate-y-0.5 transition duration-300">
            
            <!-- Header section (IDs, invoice and copy triggers) -->
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-4">
              <div class="flex flex-wrap items-center gap-3 text-xs text-slate-400">
                
                <div class="flex items-center gap-1 bg-slate-50 border border-slate-200/60 rounded-md px-2 py-1">
                  <span class="font-bold text-slate-600">${o.id}</span>
                  <button onclick="copyText('${o.id}', 'ID Pesanan')" class="text-slate-400 hover:text-slate-600 transition" title="Salin ID Pesanan">
                    <i class="ti ti-copy text-[13px]"></i>
                  </button>
                </div>

                <div class="flex items-center gap-1 bg-slate-50 border border-slate-200/60 rounded-md px-2 py-1">
                  <span class="text-slate-500 font-medium">${o.invoice}</span>
                  <button onclick="copyText('${o.invoice}', 'Invoice')" class="text-slate-400 hover:text-slate-600 transition" title="Salin Invoice">
                    <i class="ti ti-copy text-[13px]"></i>
                  </button>
                </div>

                ${o.trackingNumber ? `
                <div class="flex items-center gap-1 bg-blue-50/60 border border-blue-100 rounded-md px-2 py-1 text-blue-600">
                  <i class="ti ti-truck text-[13px]"></i>
                  <span class="font-semibold">${o.trackingNumber}</span>
                  <button onclick="copyText('${o.trackingNumber}', 'Resi')" class="text-blue-400 hover:text-blue-600 transition" title="Salin No Resi">
                    <i class="ti ti-copy text-[13px]"></i>
                  </button>
                </div>
                ` : ''}

              </div>
            </div>

            <!-- Main Info Section (Grid 3 columns) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              <!-- Product list -->
              <div class="space-y-1">
                ${itemsHtml}
              </div>

              <!-- Shipping Destination -->
              <div class="space-y-1">
                <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-outfit">Alamat Pengiriman</h5>
                <p class="font-bold text-xs text-slate-800">${displayCustomer} - ${displayPhone}</p>
                <p class="text-xs text-slate-500 leading-relaxed mt-1">${addressText}</p>
              </div>

              <!-- Shipping Logistics Courier Dropdown (Only relevant for processed or shipped items) -->
              <div class="space-y-1">
                <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-outfit">Kurir</h5>
                
                <div class="relative w-full max-w-[200px]">
                  <select onchange="updateCourier('${o.id}', this.value)" class="w-full bg-slate-100 border border-transparent hover:bg-slate-200/70 text-slate-700 text-xs font-semibold py-2 pl-3 pr-8 rounded-xl appearance-none focus:outline-none focus:ring-2 focus:ring-brand-blueRoyal/20 transition cursor-pointer">
                    <option value="Atur kurir..." ${o.courier === 'Atur kurir...' ? 'selected' : ''}>Atur kurir...</option>
                    <option value="JNE Regular" ${o.courier === 'JNE Regular' ? 'selected' : ''}>JNE Regular</option>
                    <option value="J&T Express" ${o.courier === 'J&T Express' ? 'selected' : ''}>J&T Express</option>
                    <option value="SiCepat" ${o.courier === 'SiCepat' ? 'selected' : ''}>SiCepat</option>
                    <option value="GoSend Instant" ${o.courier === 'GoSend Instant' ? 'selected' : ''}>GoSend Instant</option>
                    <option value="GrabExpress" ${o.courier === 'GrabExpress' ? 'selected' : ''}>GrabExpress</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                    <i class="ti ti-user text-sm"></i>
                  </div>
                </div>
              </div>

            </div>

            <!-- Footer Details & Quick Action Panel -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-t border-slate-100 pt-4 mt-4">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs text-slate-400 flex items-center gap-1 mr-2">
                  <i class="ti ti-calendar text-sm"></i>
                  Dipesan Pada ${o.date}
                </span>

                <span class="px-2 py-0.5 rounded border text-[10px] font-bold tracking-wide ${payBadgeClass}">
                  ${payText}
                </span>

                <span class="px-2 py-0.5 rounded border text-[10px] font-bold tracking-wide ${shipBadgeClass}">
                  ${shipText}
                </span>
              </div>

              <!-- Price breakdown & action click triggers -->
              <div class="flex items-center justify-between sm:justify-end gap-6">
                <div class="text-left sm:text-right">
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Pesanan</span>
                  <p class="font-bold font-outfit text-slate-800 text-base">Rp ${o.amount.toLocaleString('id-ID')}</p>
                </div>
                ${actionButtonHtml}
              </div>

            </div>

          </div>
        `;
      });
    }

    // Attach listeners and initial render
    document.addEventListener("DOMContentLoaded", function() {
      const searchInput = document.getElementById('search-input');
      const dateInput = document.getElementById('date-input');

      searchInput.addEventListener('input', renderOrders);
      dateInput.addEventListener('change', renderOrders);

      // Trigger initial tab active state
      setFilterTab('Semua');
    });
  </script>

</body>
</html>
